name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run theme:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build

      # Install the base into a fresh project, the same way a WinLab app would.
      - name: Smoke test shadcn init
        run: |
          bun run start -p 4890 &
          for i in $(seq 1 30); do curl -sf localhost:4890/r/base.json > /dev/null && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          bunx shadcn@latest init http://localhost:4890/r/base.json -t next -n app --no-monorepo -y
          cd app
          grep -q '"@winlab": "https://ui.winlab.tw/r/{name}.json"' components.json
          grep -q -- '--primary: oklch(0.378 0.182 262.5)' app/globals.css
          grep -q '@import "shadcn/tailwind.css"' app/globals.css
          bun run build
