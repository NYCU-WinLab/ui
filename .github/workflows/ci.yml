name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run theme:check
      - run: bun run tokens:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Start the image with compose
        run: docker compose up -d --build --wait
      - name: Serve the site and registry
        run: |
          curl -sf localhost:8080/ | grep -q "WinLab UI"
          curl -sf localhost:8080/button | grep -q "npx shadcn@latest add @winlab/button"
          curl -sf localhost:8080/colors | grep -q "primary"
          curl -sf localhost:8080/r/registry.json | grep -q '"name": "winlab"'
          curl -sfI localhost:8080/r/base.json | grep -qi "content-type: application/json"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/missing)" = 404
          curl -s localhost:8080/missing | grep -q '找不到這個頁面'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/404)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/404.html)" = 404
          curl -s localhost:8080/404 | grep -q '找不到這個頁面'
          ! curl -sI localhost:8080/ | grep -qi "server: nginx/"

      # Install the base into a fresh project, the same way a WinLab app would.
      # Items depend on each other by absolute URL; point those at the files
      # inside this image so unreleased items resolve.
      - name: Smoke test shadcn init
        run: |
          mkdir -p "$RUNNER_TEMP/registry"
          docker compose cp web:/usr/share/nginx/html/r "$RUNNER_TEMP/registry/r"
          sed -i 's#https://ui.winlab.tw/r/\([a-z-]*\)\.json#http://localhost:8099/r/\1.json#g' "$RUNNER_TEMP"/registry/r/*.json
          (cd "$RUNNER_TEMP/registry" && python3 -m http.server 8099 > /dev/null 2>&1 &)
          for i in $(seq 1 10); do curl -sf localhost:8099/r/base.json > /dev/null && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          # The style is "winlab", so shadcn's own items do not resolve: create
          # the Next app first, then init from the base.
          bunx create-next-app@latest app --ts --tailwind --eslint --app --no-src-dir --import-alias "@/*" --use-bun --yes
          cd app
          bunx shadcn@latest init http://localhost:8099/r/base.json -y
          grep -q '"style": "winlab"' components.json
          ! bunx shadcn@latest add button -y
          grep -q '"@winlab": "https://ui.winlab.tw/r/{name}.json"' components.json
          grep -q -- '--primary: oklch(0.378 0.182 262.5)' app/globals.css
          grep -q '@import "shadcn/tailwind.css"' app/globals.css
          grep -q -- '--font-sans: var(--font-inter), var(--font-noto-sans-jp), var(--font-noto-sans-tc), sans-serif' app/globals.css
          grep -q 'Noto_Sans_JP' app/layout.tsx
          grep -q -- '--text-\*: initial' app/globals.css
          grep -q -- '--text-title: 1.5rem' app/globals.css
          grep -q -- '--text-body: 1rem' app/globals.css
          grep -q -- '--success: oklch(0.52 0.09 185)' app/globals.css
          grep -q -- '--color-warning: var(--warning)' app/globals.css
          grep -q '@utility w-menu' app/globals.css
          grep -q '@utility duration-overlay' app/globals.css
          grep -q 'prefers-reduced-motion' app/globals.css
          bunx shadcn@latest add http://localhost:8099/r/button.json -y -o
          grep -q 'text-body' components/ui/button.tsx
          ! grep -q 'text-sm' components/ui/button.tsx
          bunx shadcn@latest add http://localhost:8099/r/dialog.json http://localhost:8099/r/alert-dialog.json -y -o
          grep -q 'text-title' components/ui/dialog.tsx
          grep -q 'from "@/components/ui/button"' components/ui/dialog.tsx
          bunx shadcn@latest add http://localhost:8099/r/select.json http://localhost:8099/r/table.json -y -o
          ! grep -q 'text-sm' components/ui/select.tsx components/ui/table.tsx
          bunx shadcn@latest add http://localhost:8099/r/popover.json http://localhost:8099/r/command.json -y -o
          grep -q 'rounded-menu' components/ui/popover.tsx
          grep -q 'cmdk' package.json
          bunx shadcn@latest add http://localhost:8099/r/dropdown-menu.json -y -o
          grep -q 'rounded-menu' components/ui/dropdown-menu.tsx
          bunx shadcn@latest add http://localhost:8099/r/checkbox.json http://localhost:8099/r/switch.json -y -o
          grep -q 'rounded-full' components/ui/checkbox.tsx
          bunx shadcn@latest add http://localhost:8099/r/tabs.json http://localhost:8099/r/avatar.json http://localhost:8099/r/tooltip.json http://localhost:8099/r/separator.json http://localhost:8099/r/collapsible.json -y -o
          grep -q 'rounded-menu' components/ui/tabs.tsx
          bunx shadcn@latest add http://localhost:8099/r/sonner.json -y -o
          grep -q 'unstyled: true' components/ui/sonner.tsx
          bunx shadcn@latest add http://localhost:8099/r/combobox.json -y -o
          grep -q 'fieldTriggerClassName' components/ui/combobox.tsx components/ui/select.tsx
          test -f lib/field.ts
          bunx shadcn@latest add http://localhost:8099/r/app-shell.json -y -o
          grep -q 'NYCU WinLab' components/app-shell.tsx
          bunx shadcn@latest add http://localhost:8099/r/confirm-dialog.json -y -o
          grep -q 'useTransition' components/confirm-dialog.tsx
          bunx shadcn@latest add http://localhost:8099/r/form-dialog.json -y -o
          grep -q 'fieldset' components/form-dialog.tsx
          bunx shadcn@latest add http://localhost:8099/r/empty-state.json -y -o
          grep -q '還沒有' components/empty-state.tsx
          bunx shadcn@latest add http://localhost:8099/r/page-header.json -y -o
          grep -q 'page-header' components/page-header.tsx
          bunx shadcn@latest add http://localhost:8099/r/list-skeleton.json -y -o
          grep -q 'TableSkeleton' components/list-skeleton.tsx
          bun run build
      - if: always()
        run: docker compose logs
