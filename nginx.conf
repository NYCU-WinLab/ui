server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Registry items change on every release; let clients revalidate.
  location /r/ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # The not-found page is only ever an error response, never a 200.
  location = /404 {
    return 404;
  }

  location = /404.html {
    internal;
  }

  error_page 404 /404.html;
}
