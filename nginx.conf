server {
  listen 8080;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Registry items change on every release; let clients revalidate.
  location /r/ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  error_page 404 /404.html;
}
