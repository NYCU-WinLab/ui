# The commit in the version corner: UI_VERSION is sha-<commit> on Carrel,
# and anything else (a local build) reads dev.
map "${UI_VERSION}" $build_sha {
  ~^sha-(?<commit>[0-9a-f]+)$ $commit;
  default dev;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  sub_filter __BUILD_SHA__ $build_sha;
  sub_filter_once off;
  sub_filter_types application/javascript text/javascript text/plain text/x-component;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Registry items change on every release; let clients revalidate.
  location /r/ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # The not-found page is only ever an error response, never a 200.
  location = /404 {
    return 404;
  }

  location = /404.html {
    internal;
  }

  error_page 404 /404.html;
}
